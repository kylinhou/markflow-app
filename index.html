<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkFlow</title>
</head>
<body>
  <!-- Unified header: tab list + actions in a single row -->
  <header id="unified-header">
    <div id="tab-container">
      <div id="tab-list"></div>
      <button id="tab-new" title="New Tab">+</button>
    </div>
    <div id="header-actions">
      <button id="outline-toggle" title="Toggle Outline (Ctrl+Shift+O)">&#8803;</button>
      <div id="agent-dot"></div>
    </div>
  </header>
  <div id="editor-layout">
    <aside id="outline-sidebar" class="outline-hidden">
      <div class="outline-header">
        <span>Contents</span>
        <button id="content-width-toggle" class="width-label-btn">宽度调节</button>
      </div>
      <div id="content-width-slider-wrap">
        <div class="width-row">
          <span id="content-width-value">1020</span>
        </div>
        <input type="range" id="content-width-slider" class="content-width-slider"
          min="480" max="1400" step="20" value="1020">
      </div>
      <div id="outline-tree"></div>
      <div class="outline-empty" id="outline-empty">No headings found</div>
    </aside>
    <div id="resize-handle-left" class="resize-handle"></div>
    <div id="editor"></div>
    <div id="resize-handle-right" class="resize-handle"></div>
    <aside id="comment-sidebar" class="comment-hidden">
      <div class="comment-header">
        <span>评论</span>
        <button id="comment-close-btn" class="comment-close-btn">&times;</button>
      </div>
      <div id="comment-list"></div>
      <div id="comment-empty" class="comment-empty visible">暂无评论，选中文本即可发起评论</div>
    </aside>
  </div>
  <div id="comment-bubble-menu">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
    </svg>
    <span>添加评论</span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
