name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']                    # case 3: 打 tag → build + release
  pull_request:
    branches: [main]
  workflow_dispatch:                 # case 3: 手动触发构建，不 push 代码

concurrency:
  # push main / push tag / workflow_dispatch 共享同一组
  # 新 push 到来时取消正在进行的 run
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 判断是否需要构建（跳过纯文档改动）───────────────────────────────
  should-build:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ fromJson(steps.filter.outputs.changed) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            core: |
              src/**
              src-tauri/**
              package.json
              package-lock.json
              Cargo.toml
              Cargo.lock
              tauri.conf.json

  # ── 2. 构建（三平台）─────────────────────────────────────────────────
  build:
    needs: should-build
    # 未改变核心代码时跳过（文档-only 改动）；workflow_dispatch 总是允许
    if: needs.should-build.outputs.value == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install create-dmg

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markflow-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
          retention-days: 5

  # ── 3. 创建 Release（仅 tag push 时触发）──────────────────────────────
  release:
    needs: build
    # 仅在 tag push 时执行；workflow_dispatch 手动触发时跳过
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
